[package]
name = "tui_mcp"
version = "1.2.1"
edition = "2024"
description = "An MCP server for remote-controlling and observing TUI programs via a real PTY and an embedded terminal emulator."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fabian2000/tui_mcp"
readme = "README.md"
keywords = ["mcp", "tui", "terminal", "pty", "automation"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Exposes the `dev_info` tool, which reports the running executable's path and
# mtime. Off by default: it exists to confirm a reload picked up a rebuild, so a
# released server has no use for it.
dev-tools = ["dep:chrono"]

[dependencies]
rmcp = { version = "0.8", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
vt100 = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
schemars = "1"
parking_lot = "0.12"
tracing = "0.1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Only for `dev_info`'s timestamps, and only under `dev-tools`.
#
# Nothing extra compiles while rmcp and schemars keep pulling chrono 0.4 in:
# cargo unifies their requirements with this one onto a single build of it.
# A manifest cannot ask for "whatever my dependencies already use", so if they
# move to 0.5 and this stays, cargo silently compiles a second copy rather than
# reporting a conflict. Move this in step with them.
chrono = { version = "0.4", optional = true, default-features = false, features = [
    "std",
] }

# cfg() on build-dependencies resolves against the HOST, not the target, so this
# only applies when building *on* Windows -- matching the #[cfg(windows)] gate on
# build.rs's main. Cross-compiling to Windows from another host therefore yields
# an exe with no version resource; if that is ever needed, move this to a plain
# [build-dependencies] and drop the #[cfg(windows)] in build.rs.
[target.'cfg(windows)'.build-dependencies]
# default-features = false drops the "toml" feature, which only exists to parse
# [package.metadata.winresource]; build.rs sets every field programmatically.
winresource = { version = "0.1", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[profile.release]
strip = true
